<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Week</title>
<meta name="theme-color" content="#3d1fd1">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233d1fd1'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle'%3E%F0%9F%97%93%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#e4e6ec;--card:#ffffff;--ink:#14121c;--mute:#4f4a5e;--line:#c9cbd6;
  --accent:#3d1fd1;--accent2:#e0115f;--teal:#00897b;--purple:#7b2cbf;
  --red:#d90429;--orange:#f76b00;--yellow:#ffbf00;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  font-size:15px;line-height:1.25;padding:8px 10px 30px;max-width:560px;margin:0 auto}
button{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 6px}
h1{font-size:20px;letter-spacing:-.3px;display:flex;align-items:center;gap:6px}
h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.calbtn{font-size:20px;line-height:1;padding:3px 5px;border-radius:9px;background:var(--card);border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.today{font-size:12px;color:var(--mute)}

/* Weather */
.wx{background:linear-gradient(120deg,#0b4fd6,#3d1fd1);color:#fff;border-radius:12px;padding:7px 10px;margin-bottom:7px;box-shadow:0 2px 8px rgba(80,70,200,.18)}
.wx-top{display:flex;align-items:center;gap:8px}
.wx-icon{font-size:26px;line-height:1}
.wx-now{font-size:22px;font-weight:700}
.wx-hl{font-size:13px;opacity:.95}
.wx-row{display:flex;gap:12px;font-size:13px;margin-top:3px;flex-wrap:wrap}
.wx-sum{font-size:13px;margin-top:3px;opacity:.95}
.wx-retry{margin-top:5px;background:#fff;color:#3d1fd1;border-radius:7px;padding:4px 10px;font-size:13px;font-weight:700}

/* Day tabs */
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:7px}
.tab{background:var(--card);border-radius:9px;padding:4px 0;text-align:center;border:1px solid var(--line);position:relative}
.tab b{display:block;font-size:12px}
.tab small{font-size:11px;color:var(--mute)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab.on small{color:#fff}
.tab .dot{position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent2)}
.tab.on .dot{background:#fff}

/* "Viewing another date" bar */
.viewing{display:none;align-items:center;justify-content:space-between;background:var(--accent2);color:#fff;border-radius:9px;padding:5px 8px;margin-bottom:7px;font-size:13px;font-weight:600}
.viewing.show{display:flex}
.viewing button{background:#fff;color:var(--accent2);border-radius:7px;padding:3px 8px;font-size:12px;font-weight:700}

/* Look-ahead list */
.ahead-btn{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 9px;margin-bottom:7px;font-size:13px;font-weight:700;color:var(--accent)}
.ahead-btn.open{background:var(--accent);border-color:var(--accent);color:#fff}
.ahead{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 8px;margin-bottom:7px}
.ahead.show{display:block}
.ah-day{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.ah-day:last-child{border-bottom:none}
.ah-lbl{flex:none;width:50px;font-weight:700;font-size:13px;line-height:1.15}
.ah-lbl small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.ah-lbl.today{color:var(--accent)}
.ah-items{flex:1;min-width:0;font-size:13px}
.ah-it{display:flex;align-items:center;gap:6px;padding:1px 0;word-break:break-word}
.ah-dot{flex:none;width:9px;height:9px;border-radius:50%}
.ah-none{color:var(--mute);font-size:12px;padding:1px 0}

/* Sections */
.sec{background:var(--card);border-radius:12px;padding:6px 8px 7px;margin-bottom:7px;border:1px solid var(--line)}
.sec h2{font-size:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sec h2 em{font-style:normal;font-size:11px;color:var(--mute);font-weight:400}
.empty{font-size:12px;color:var(--mute);padding:2px 2px 4px}

/* Items */
.item{display:flex;align-items:flex-start;gap:6px;padding:4px 4px 4px 7px;border-left:6px solid var(--line);border-radius:6px;background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:3px}
.item.p0{border-left-color:var(--red)}
.item.p1{border-left-color:var(--orange)}
.item.p2{border-left-color:var(--yellow)}
.item.get{border-left-color:var(--teal)}
.body{flex:1;min-width:0}
.txt{font-weight:600;word-break:break-word;text-align:left;width:100%}
.note{font-size:12px;color:var(--mute);margin-top:1px;word-break:break-word}
.note:before{content:"↳ "}
.pris{display:flex;gap:3px;padding-top:2px}
.pri{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.35)}
.pri.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.pri.r{background:var(--red)}.pri.o{background:var(--orange)}.pri.y{background:var(--yellow)}
.del{color:var(--mute);font-size:19px;font-weight:700;line-height:1;padding:0 4px}
.del.sure{background:var(--red);color:#fff;font-size:12px;border-radius:6px;padding:3px 6px}
.auto{font-size:10px;color:var(--red);font-weight:700;padding-top:3px}

/* Add rows */
.add{display:flex;flex-direction:column;gap:4px;margin-top:5px}
.add-row{display:flex;gap:4px;align-items:center}
.add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:#fff;font-size:14px}
.add input.n{font-size:12px;padding:4px 7px}
.fld{position:relative;flex:1;min-width:0;display:flex}
.fld input{padding-right:32px}
.mic{position:absolute;right:3px;top:50%;transform:translateY(-50%);font-size:15px;padding:2px 5px;border-radius:6px;line-height:1.2}
.mic.live{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.plus{background:var(--accent);color:#fff;border-radius:8px;padding:5px 11px;font-weight:700}
.plus.g{background:var(--teal)}
.plus.f{background:var(--purple)}

/* Focus Areas */
.sec.focus{border-left:6px solid var(--purple)}
.sec.focus h2{color:var(--purple)}
.item.foc{border-left-color:var(--purple);align-items:center}
.ficon{flex:none;width:26px;height:26px;border-radius:50%;background:var(--purple);display:grid;place-items:center;font-size:14px}
.item.foc.editing{align-items:flex-start}
.moves{display:flex;flex-direction:column;gap:2px}
.mv{background:var(--purple);color:#fff;border-radius:5px;width:26px;height:18px;font-size:10px;line-height:1}
.mv:disabled{background:var(--line);color:#fff;cursor:default}
.item.foc.moved{animation:flash .6s}
@keyframes flash{0%{background:#e9d8ff}100%{background:#fff}}
.ein{width:100%;border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:14px;margin-bottom:3px}
.ein.n{font-size:12px;margin-bottom:0}
.ebtns{display:flex;flex-direction:column;gap:3px}
.esave{background:var(--purple);color:#fff;border-radius:7px;padding:4px 8px;font-size:12px;font-weight:700}
.ecancel{background:var(--bg);color:var(--mute);border-radius:7px;padding:4px 8px;font-size:12px;font-weight:700}

/* Bottom sheets (copy-to-day and calendar) */
.veil{position:fixed;inset:0;background:rgba(20,15,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.veil.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:12px 12px 18px}
.sheet p{font-size:14px;margin-bottom:8px;text-align:center}
.sheet .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sheet .grid button{background:var(--bg);border-radius:9px;padding:7px 0;font-weight:600;font-size:13px;line-height:1.2}
.sheet .grid button small{display:block;font-size:11px;font-weight:400;color:var(--mute)}
.sheet .cancel{display:block;width:100%;margin-top:8px;padding:8px;color:var(--mute)}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head b{font-size:16px}
.cal-nav{background:var(--accent);color:#fff;border-radius:8px;width:36px;height:30px;font-size:16px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-h{text-align:center;font-size:11px;font-weight:700;color:var(--mute);padding-bottom:2px}
.cal-d{position:relative;height:40px;border-radius:8px;background:var(--bg);font-weight:600;font-size:14px}
.cal-d.past{color:#8a8598}
.cal-d.today{background:var(--accent);color:#fff}
.cal-d.sel{box-shadow:inset 0 0 0 2px var(--accent2)}
.cal-d i{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--accent2)}
.cal-d.today i{background:#fff}
.cal-d s{position:absolute;top:1px;right:2px;font-size:9px;text-decoration:none}
.calsheet{max-height:88vh;overflow-y:auto;padding-bottom:0}
.cal-list{margin-top:10px;border-top:2px solid var(--line);padding-top:6px}
.cl-title{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.cl-day{display:flex;gap:8px;width:100%;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.cl-day:last-child{border-bottom:none}
.cl-day.today .cl-date{color:var(--accent)}
.cl-day.past{opacity:.6}
.cl-date{flex:none;width:52px;font-weight:700;font-size:13px;line-height:1.15}
.cl-date small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.cl-items{flex:1;min-width:0;font-size:13px}
.cl-it{display:flex;align-items:baseline;gap:6px;padding:1px 0;word-break:break-word}
.cl-dot{flex:none;width:9px;height:9px;border-radius:50%;align-self:center}
.cl-note{color:var(--mute);font-size:12px}
.cl-none{font-size:12px;color:var(--mute);padding:4px 2px}
.cal-foot{display:flex;gap:6px;margin-top:8px;position:sticky;bottom:0;background:#fff;padding:8px 0 18px}
.cal-foot button{flex:1;padding:8px;border-radius:9px;font-weight:600}
.cal-foot .go{background:var(--accent);color:#fff}
.cal-foot .x{background:var(--bg);color:var(--mute)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1><button class="calbtn" id="calBtn" aria-label="Open calendar">🗓️</button><span>My Week</span></h1>
  <div class="today" id="todayLbl"></div>
</header>

<div class="wx" id="wx">
  <div class="wx-top"><div class="wx-icon">⏳</div><div class="wx-hl">Loading today's weather…</div></div>
</div>

<nav class="tabs" id="tabs"></nav>

<div class="viewing" id="viewing"><span id="viewingLbl"></span><button id="backToday">Back to today</button></div>

<button class="ahead-btn" id="aheadBtn"><span>📋 Look ahead this week</span><span id="aheadArrow">▾</span></button>
<div class="ahead" id="ahead"></div>

<section class="sec">
  <h2>✅ To-Do <em id="todoCount"></em></h2>
  <div id="todoList"></div>
  <div class="add">
    <div class="add-row">
      <div class="fld"><input id="todoTxt" placeholder="Add a to-do…"><button class="mic" data-for="todoTxt" aria-label="speak">🎤</button></div>
      <div class="pris" id="newPri"></div>
      <button class="plus" id="todoAdd">+</button>
    </div>
    <div class="fld"><input class="n" id="todoNote" placeholder="Note (optional)"><button class="mic" data-for="todoNote" aria-label="speak">🎤</button></div>
  </div>
</section>

<section class="sec focus">
  <h2>🎯 Focus Areas <em id="focusCount"></em></h2>
  <div id="focusList"></div>
  <div class="add">
    <div class="add-row">
      <div class="fld"><input id="focusTxt" placeholder="Add a focus area…"><button class="mic" data-for="focusTxt" aria-label="speak">🎤</button></div>
      <button class="plus f" id="focusAdd">+</button>
    </div>
    <div class="fld"><input class="n" id="focusNote" placeholder="Note (optional)"><button class="mic" data-for="focusNote" aria-label="speak">🎤</button></div>
  </div>
</section>

<section class="sec">
  <h2>📝 Working List <em id="getCount"></em></h2>
  <div id="getList"></div>
  <div class="add">
    <div class="add-row">
      <div class="fld"><input id="getTxt" placeholder="Add to your working list…"><button class="mic" data-for="getTxt" aria-label="speak">🎤</button></div>
      <button class="plus g" id="getAdd">+</button>
    </div>
    <div class="fld"><input class="n" id="getNote" placeholder="Note (optional)"><button class="mic" data-for="getNote" aria-label="speak">🎤</button></div>
  </div>
</section>

<!-- Copy-to-day sheet -->
<div class="veil" id="veil">
  <div class="sheet">
    <p id="sheetMsg"></p>
    <div class="grid" id="sheetDays"></div>
    <button class="cancel" id="sheetCancel">Cancel</button>
  </div>
</div>

<!-- Calendar sheet -->
<div class="veil" id="calVeil">
  <div class="sheet calsheet">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" aria-label="Previous month">‹</button>
      <b id="calTitle"></b>
      <button class="cal-nav" id="calNext" aria-label="Next month">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-list" id="calList"></div>
    <div class="cal-foot">
      <button class="go" id="calToday">Today</button>
      <button class="x" id="calClose">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const PRI_CLASS=["r","o","y"];
const KEY="myweek.v1";
const LAT=40.90, LON=-81.55;           // home area
const TRASH_START=new Date(2026,9,12); // Mon Oct 12, 2026, then every other Monday

/* ---------- Dates ---------- */
function startOfToday(){const d=new Date();d.setHours(0,0,0,0);return d;}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function fromYmd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
let today=startOfToday();
let curDate=new Date(today);
// Each tab shows the next time that weekday comes around (today counts)
function dateFor(i){const d=new Date(today);d.setDate(d.getDate()+((i-today.getDay()+7)%7));return d;}
function isTrash(d){
  if(d.getDay()!==1)return false;
  const diff=Math.round((d-TRASH_START)/86400000);
  return diff>=0&&diff%14===0;
}
const same=(a,b)=>a.getTime()===b.getTime();

/* ---------- Saved data (stored by actual date) ---------- */
let data=null;
try{data=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(data&&data.days&&!data.dates){
  // Older weekday-based save: move each weekday's items onto its upcoming date
  const old=data.days;data={dates:{}};
  DAYS.forEach((d,i)=>{const o=old[i];if(o&&((o.todo||[]).length||(o.get||[]).length))data.dates[ymd(dateFor(i))]={todo:o.todo||[],get:o.get||[]};});
}
if(!data||!data.dates){
  data={dates:{}}; // fresh start: no sample items
}
// Focus Areas: one standing list, shown on every day
if(!Array.isArray(data.focus)){
  data.focus=[{t:"Exercise",n:""},{t:"Bible study",n:""},{t:"Protein drink",n:"Every day"}];
}
// Working List: one standing list, shown on every day.
// Items saved under particular days by earlier versions move into it once.
if(!Array.isArray(data.get)){
  data.get=[];
  Object.keys(data.dates).sort().forEach(k=>{
    const e=data.dates[k];
    (e.get||[]).forEach(it=>{if(!data.get.some(x=>x.t===it.t&&x.n===it.n))data.get.push(it);});
    e.get=[];
  });
}
function save(){
  Object.keys(data.dates).forEach(k=>{const e=data.dates[k];if(!e.todo.length)delete data.dates[k];});
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
}
save();
function dayOf(d){const k=ymd(d);return data.dates[k]||(data.dates[k]={todo:[],get:[]});}
function hasItems(d){const e=data.dates[ymd(d)];return !!(e&&e.todo.length);}

/* ---------- Helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1600);}
const longDate=d=>d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:d.getFullYear()!==today.getFullYear()?"numeric":undefined});

/* ---------- Render ---------- */
let newPri=1;
function onTabs(){return DAYS.some((d,i)=>same(dateFor(i),curDate));}
function renderTabs(){
  $("tabs").innerHTML=DAYS.map((d,i)=>{
    const dt=dateFor(i);
    const has=hasItems(dt)||isTrash(dt);
    return `<button class="tab${same(dt,curDate)?" on":""}" data-day="${i}">${has?'<span class="dot"></span>':""}<b>${d.slice(0,3)}</b><small>${dt.getMonth()+1}/${dt.getDate()}</small></button>`;
  }).join("");
  const v=$("viewing");
  if(onTabs()){v.classList.remove("show");}
  else{$("viewingLbl").textContent=`📌 ${longDate(curDate)}`;v.classList.add("show");}
}
function priDots(p,idx){
  return `<div class="pris">${PRI_CLASS.map((c,k)=>`<button class="pri ${c}${k===p?" on":""}" data-act="pri" data-i="${idx}" data-p="${k}" aria-label="priority"></button>`).join("")}</div>`;
}
function renderTodo(){
  const day=dayOf(curDate),trash=isTrash(curDate);
  let html="";
  if(trash){
    html+=`<div class="item p0"><div class="body"><div class="txt">🗑️ Trash day</div></div><span class="auto">AUTO</span></div>`;
  }
  html+=day.todo.map((it,i)=>`
    <div class="item p${it.p}">
      <div class="body">
        <button class="txt" data-act="copy" data-i="${i}">${esc(it.t)}</button>
        ${it.n?`<div class="note">${esc(it.n)}</div>`:""}
      </div>
      ${priDots(it.p,i)}
      <button class="del" data-act="deltodo" data-i="${i}" aria-label="delete">×</button>
    </div>`).join("");
  $("todoList").innerHTML=html||`<div class="empty">Nothing yet — enjoy the free day 🎉</div>`;
  const n=day.todo.length+(trash?1:0);
  $("todoCount").textContent=n?`${n} item${n>1?"s":""}`:"";
}
function renderGet(){
  $("getList").innerHTML=data.get.map((it,i)=>`
    <div class="item get">
      <div class="body">
        <div class="txt">${esc(it.t)}</div>
        ${it.n?`<div class="note">${esc(it.n)}</div>`:""}
      </div>
      <button class="del" data-act="delget" data-i="${i}" aria-label="delete">×</button>
    </div>`).join("")||`<div class="empty">Nothing on your working list.</div>`;
  const n=data.get.length;
  $("getCount").textContent=n?`${n} item${n>1?"s":""}`:"";
}
// Picks a fitting icon from the words in a focus area
const FOCUS_ICONS=[[/exercis|workout|gym|lift|run|walk|cardio/i,"💪"],[/bible|scripture|devotion|church/i,"📖"],
  [/pray/i,"🙏"],[/protein|shake|drink/i,"🥤"],[/water|hydrat/i,"💧"],[/sleep|bed|rest/i,"😴"],
  [/meditat|stretch|yoga/i,"🧘"],[/read|book|study/i,"📚"],[/eat|diet|food|meal|nutrition/i,"🥗"],
  [/vitamin|pill|supplement/i,"💊"],[/money|budget|sav/i,"💰"],[/family|wife|kids|grand/i,"❤️"]];
function focusIcon(t){const m=FOCUS_ICONS.find(([re])=>re.test(t));return m?m[1]:"⭐";}
let editingFocus=-1;
function renderFocus(){
  $("focusList").innerHTML=data.focus.map((it,i)=>i===editingFocus?`
    <div class="item foc editing">
      <span class="ficon">${focusIcon(it.t)}</span>
      <div class="body">
        <input class="ein" id="feT" value="${esc(it.t)}">
        <input class="ein n" id="feN" value="${esc(it.n)}" placeholder="Note (optional)">
      </div>
      <div class="ebtns">
        <button class="esave" data-act="fsave" data-i="${i}">Save</button>
        <button class="ecancel" data-act="fcancel">Cancel</button>
      </div>
    </div>`:`
    <div class="item foc">
      <span class="ficon">${focusIcon(it.t)}</span>
      <div class="body">
        <button class="txt" data-act="fedit" data-i="${i}">${esc(it.t)}</button>
        ${it.n?`<div class="note">${esc(it.n)}</div>`:""}
      </div>
      <div class="moves">
        <button class="mv" data-act="fup" data-i="${i}" aria-label="move up"${i===0?" disabled":""}>▲</button>
        <button class="mv" data-act="fdown" data-i="${i}" aria-label="move down"${i===data.focus.length-1?" disabled":""}>▼</button>
      </div>
      <button class="del" data-act="delfocus" data-i="${i}" aria-label="delete">×</button>
    </div>`).join("")||`<div class="empty">Add what you're focusing on right now.</div>`;
  const n=data.focus.length;
  $("focusCount").textContent=n?`${n} area${n>1?"s":""}`:"";
  if(editingFocus>=0){const inp=$("feT");if(inp){inp.focus();
    ["feT","feN"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")document.querySelector(".esave").click();}));}}
}
// Week look-ahead: today and the next 6 days, top to bottom
let aheadOpen=false;
const PRI_COLOR=["var(--red)","var(--orange)","var(--yellow)"];
function renderAhead(){
  $("aheadBtn").classList.toggle("open",aheadOpen);
  $("aheadArrow").textContent=aheadOpen?"▴":"▾";
  const box=$("ahead");box.classList.toggle("show",aheadOpen);
  if(!aheadOpen)return;
  let h="";
  for(let k=0;k<7;k++){
    const dt=new Date(today);dt.setDate(dt.getDate()+k);
    const e=data.dates[ymd(dt)],todos=e?e.todo:[];
    let items=isTrash(dt)?`<div class="ah-it"><span class="ah-dot" style="background:var(--red)"></span>🗑️ Trash day</div>`:"";
    items+=todos.map(it=>`<div class="ah-it"><span class="ah-dot" style="background:${PRI_COLOR[it.p]}"></span>${esc(it.t)}</div>`).join("");
    h+=`<div class="ah-day">
      <div class="ah-lbl${k===0?" today":""}">${k===0?"Today":DAYS[dt.getDay()].slice(0,3)}<small>${k===0?DAYS[dt.getDay()].slice(0,3)+" ":""}${dt.getMonth()+1}/${dt.getDate()}</small></div>
      <div class="ah-items">${items||`<div class="ah-none">Nothing yet</div>`}</div>
    </div>`;
  }
  box.innerHTML=h;
}
function renderNewPri(){
  $("newPri").innerHTML=PRI_CLASS.map((c,k)=>`<button class="pri ${c}${k===newPri?" on":""}" data-np="${k}" aria-label="priority"></button>`).join("");
}
function render(){
  $("todayLbl").textContent=today.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
  renderTabs();renderAhead();renderTodo();renderFocus();renderGet();renderNewPri();renderWeather();
}
function goTo(d){curDate=new Date(d);render();window.scrollTo({top:0,behavior:"smooth"});}

/* ---------- Events ---------- */
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-day]");if(!b)return;goTo(dateFor(+b.dataset.day));});
$("backToday").addEventListener("click",()=>goTo(today));
$("aheadBtn").addEventListener("click",()=>{aheadOpen=!aheadOpen;renderAhead();});
$("newPri").addEventListener("click",e=>{const b=e.target.closest("[data-np]");if(!b)return;newPri=+b.dataset.np;renderNewPri();});

$("todoAdd").addEventListener("click",()=>{
  const t=$("todoTxt").value.trim();if(!t)return;
  dayOf(curDate).todo.push({t,n:$("todoNote").value.trim(),p:newPri});
  $("todoTxt").value="";$("todoNote").value="";save();render();
});
$("getAdd").addEventListener("click",()=>{
  const t=$("getTxt").value.trim();if(!t)return;
  data.get.push({t,n:$("getNote").value.trim()});
  $("getTxt").value="";$("getNote").value="";save();render();
});
$("focusAdd").addEventListener("click",()=>{
  const t=$("focusTxt").value.trim();if(!t)return;
  data.focus.push({t,n:$("focusNote").value.trim()});
  $("focusTxt").value="";$("focusNote").value="";save();renderFocus();
});
["focusTxt","focusNote"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")$("focusAdd").click();}));
["todoTxt","todoNote"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")$("todoAdd").click();}));
["getTxt","getNote"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")$("getAdd").click();}));

/* ---------- Talk-to-type (mic buttons) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
document.querySelectorAll(".mic").forEach(btn=>{
  if(!SR){btn.remove();return;} // browser can't do speech: hide the mic
  btn.addEventListener("click",()=>{
    if(rec){rec.stop();return;} // tap again to stop listening
    const input=$(btn.dataset.for);
    rec=new SR();rec.lang="en-US";rec.interimResults=false;rec.maxAlternatives=1;
    btn.classList.add("live");
    rec.onresult=e=>{
      let t=(e.results[0][0].transcript||"").trim();if(!t)return;
      t=t.charAt(0).toUpperCase()+t.slice(1);
      input.value=input.value?input.value+" "+t:t;
    };
    rec.onerror=e=>{
      if(e.error==="not-allowed"||e.error==="service-not-allowed")toast("Mic blocked — allow microphone access");
      else if(e.error==="no-speech")toast("Didn't catch that — try again");
    };
    rec.onend=()=>{btn.classList.remove("live");rec=null;};
    try{rec.start();}catch(err){btn.classList.remove("live");rec=null;toast("Mic couldn't start");}
  });
});

/* ---------- Item actions (priority, delete, copy) ---------- */
let copying=null;
document.body.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const i=+b.dataset.i, day=dayOf(curDate);
  switch(b.dataset.act){
    case "pri": day.todo[i].p=+b.dataset.p;save();renderTodo();renderAhead();break;
    case "deltodo":
    case "delget":
    case "delfocus":
      if(!b.classList.contains("sure")){ // first tap: arm it
        document.querySelectorAll(".del.sure").forEach(x=>{x.classList.remove("sure");x.textContent="×";});
        b.classList.add("sure");b.textContent="Delete?";
        setTimeout(()=>{if(b.isConnected){b.classList.remove("sure");b.textContent="×";}},3000);
      }else{ // second tap: delete
        ({deltodo:day.todo,delget:data.get,delfocus:data.focus})[b.dataset.act].splice(i,1);
        editingFocus=-1;save();render();
      }
      break;
    case "fup":
    case "fdown":{
      const j=b.dataset.act==="fup"?i-1:i+1;
      if(j<0||j>=data.focus.length)break;
      [data.focus[i],data.focus[j]]=[data.focus[j],data.focus[i]];
      editingFocus=-1;save();renderFocus();
      const moved=$("focusList").children[j];if(moved)moved.classList.add("moved");
      break;}
    case "fedit": editingFocus=i;renderFocus();break;
    case "wxretry": $("wx").innerHTML=`<div class="wx-top"><div class="wx-icon">⏳</div><div class="wx-hl">Loading today's weather…</div></div>`;loadWeather();break;
    case "fsave":{
      const t=$("feT").value.trim();
      if(t){data.focus[i]={t,n:$("feN").value.trim()};save();}
      editingFocus=-1;renderFocus();break;}
    case "fcancel": editingFocus=-1;renderFocus();break;
    case "copy": openSheet(day.todo[i]);break;
  }
});

function openSheet(item){
  copying=item;
  $("sheetMsg").innerHTML=`What day would you like to add <b>${esc(item.t)}</b> to?`;
  $("sheetDays").innerHTML=DAYS.map((d,i)=>{const dt=dateFor(i);return `<button data-to="${i}">${d.slice(0,3)}<small>${dt.getMonth()+1}/${dt.getDate()}</small></button>`;}).join("");
  $("veil").classList.add("show");
}
function closeSheet(){$("veil").classList.remove("show");copying=null;}
$("sheetDays").addEventListener("click",e=>{
  const b=e.target.closest("[data-to]");if(!b||!copying)return;
  const to=dateFor(+b.dataset.to);
  dayOf(to).todo.push({t:copying.t,n:"",p:copying.p}); // item + color, no note
  save();toast(`Added to ${DAYS[to.getDay()]}`);closeSheet();render();
});
$("sheetCancel").addEventListener("click",closeSheet);
$("veil").addEventListener("click",e=>{if(e.target.id==="veil")closeSheet();});

/* ---------- Calendar ---------- */
let calMonth=new Date(today.getFullYear(),today.getMonth(),1);
function openCal(){calMonth=new Date(curDate.getFullYear(),curDate.getMonth(),1);renderCal();$("calVeil").classList.add("show");document.querySelector(".calsheet").scrollTop=0;}
function closeCal(){$("calVeil").classList.remove("show");}
function renderCal(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  $("calTitle").textContent=calMonth.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  let h=DAYS.map(d=>`<div class="cal-h">${d[0]}</div>`).join("");
  for(let k=0;k<first;k++)h+=`<div></div>`;
  for(let dd=1;dd<=n;dd++){
    const dt=new Date(y,m,dd),cls=["cal-d"];
    if(same(dt,today))cls.push("today");
    if(same(dt,curDate))cls.push("sel");
    if(dt<today)cls.push("past");
    h+=`<button class="${cls.join(" ")}" data-date="${ymd(dt)}">${dd}${hasItems(dt)?"<i></i>":""}${isTrash(dt)?"<s>🗑️</s>":""}</button>`;
  }
  $("calGrid").innerHTML=h;
  renderCalList(y,m,n);
}
// Everything entered for the month on screen, readable without tapping
function renderCalList(y,m,n){
  const monthName=calMonth.toLocaleDateString(undefined,{month:"long"});
  let rows="";
  for(let dd=1;dd<=n;dd++){
    const dt=new Date(y,m,dd),e=data.dates[ymd(dt)];
    const todo=e?e.todo:[],trash=isTrash(dt);
    if(!todo.length&&!trash)continue;
    let items=trash?`<div class="cl-it"><span class="cl-dot" style="background:var(--red)"></span><span>🗑️ Trash day</span></div>`:"";
    items+=todo.map(it=>`<div class="cl-it"><span class="cl-dot" style="background:${PRI_COLOR[it.p]||"var(--line)"}"></span><span>${esc(it.t)}${it.n?` <span class="cl-note">— ${esc(it.n)}</span>`:""}</span></div>`).join("");
    const cls=["cl-day"];if(same(dt,today))cls.push("today");else if(dt<today)cls.push("past");
    rows+=`<button class="${cls.join(" ")}" data-date="${ymd(dt)}">
      <div class="cl-date">${DAYS[dt.getDay()].slice(0,3)}<small>${dt.getMonth()+1}/${dd}</small></div>
      <div class="cl-items">${items}</div></button>`;
  }
  $("calList").innerHTML=`<div class="cl-title">In ${esc(monthName)}</div>`+(rows||`<div class="cl-none">Nothing entered this month yet.</div>`);
}
$("calBtn").addEventListener("click",openCal);
$("calPrev").addEventListener("click",()=>{calMonth.setMonth(calMonth.getMonth()-1);renderCal();});
$("calNext").addEventListener("click",()=>{calMonth.setMonth(calMonth.getMonth()+1);renderCal();});
$("calToday").addEventListener("click",()=>{closeCal();goTo(today);});
$("calClose").addEventListener("click",closeCal);
$("calVeil").addEventListener("click",e=>{if(e.target.id==="calVeil")closeCal();});
$("calGrid").addEventListener("click",e=>{const b=e.target.closest("[data-date]");if(!b)return;closeCal();goTo(fromYmd(b.dataset.date));});
$("calList").addEventListener("click",e=>{const b=e.target.closest("[data-date]");if(!b)return;closeCal();goTo(fromYmd(b.dataset.date));});

/* ---------- Weather (Open-Meteo forecast + National Weather Service alerts) ---------- */
const WX={0:["☀️","Clear"],1:["🌤️","Mostly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],
  45:["🌫️","Fog"],48:["🌫️","Freezing fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],
  56:["🌧️","Freezing drizzle"],57:["🌧️","Freezing drizzle"],61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],
  66:["🌧️","Freezing rain"],67:["🌧️","Freezing rain"],71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],
  77:["🌨️","Snow grains"],80:["🌦️","Light showers"],81:["🌧️","Showers"],82:["⛈️","Heavy showers"],
  85:["🌨️","Snow showers"],86:["❄️","Heavy snow showers"],95:["⛈️","Thunderstorms"],96:["⛈️","Storms with hail"],99:["⛈️","Storms with hail"]};
function compass(deg){return["N","NE","E","SE","S","SW","W","NW"][Math.round(deg/45)%8];}
function windWord(mph){return mph<8?"calm winds":mph<15?"a light breeze":mph<25?"breezy":"windy";}
let wxData=null, wxErr=false, wxReason="";

// Pulls today + the next 7 days
async function loadWeather(){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`+
    `&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m`+
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant`+
    `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York&forecast_days=8`;
  try{wxData=await fetchJSON(url,15000);wxErr=false;wxReason="";}
  catch(e){wxErr=!wxData;wxReason=e&&e.message?e.message:"no answer";}
  renderWeather();
}
// Fetch JSON, giving up after `ms` milliseconds
async function fetchJSON(u,ms){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch(u,{signal:ctl.signal});
    if(!r.ok)throw new Error(`weather service answered ${r.status}`);
    return await r.json();
  }catch(e){
    if(e&&e.name==="AbortError")throw new Error("weather service took too long");
    if(e instanceof TypeError)throw new Error("couldn't reach the weather service");
    throw e;
  }finally{clearTimeout(t);}
}

// Shows the weather for whichever day is selected
function renderWeather(){
  const box=$("wx");
  if(wxErr){box.innerHTML=`<div class="wx-top"><div class="wx-icon">📡</div><div class="wx-hl">Weather couldn't load.${wxReason?`<br><small>Reason: ${esc(wxReason)}</small>`:""}</div></div>
    <button class="wx-retry" data-act="wxretry">Try again</button>`;return;}
  if(!wxData)return; // still loading
  const dt=curDate,d=wxData.daily,i=d.time.indexOf(ymd(dt));
  if(i<0){
    const msg=dt<today?"Past day — no forecast.":"No forecast this far out yet — check back closer to the day.";
    box.innerHTML=`<div class="wx-top"><div class="wx-icon">🗓️</div><div class="wx-hl">${msg}</div></div>`;return;
  }
  const isToday=same(dt,today);
  const [ic,desc]=WX[d.weather_code[i]]||["🌡️","Mixed"];
  const hi=Math.round(d.temperature_2m_max[i]),lo=Math.round(d.temperature_2m_min[i]);
  const rain=d.precipitation_probability_max[i]??0;
  const wMax=Math.round(d.wind_speed_10m_max[i]),gust=Math.round(d.wind_gusts_10m_max[i]);
  const dir=compass(d.wind_direction_10m_dominant[i]);
  const rainTxt=rain>=60?"rain likely":rain>=30?"a chance of rain":"rain unlikely";
  const big=isToday?`${Math.round(wxData.current.temperature_2m)}°`:DAYS[dt.getDay()].slice(0,3);
  const windTxt=isToday
    ?`💨 ${Math.round(wxData.current.wind_speed_10m)} mph now · up to ${wMax} ${dir} (gusts ${gust})`
    :`💨 Up to ${wMax} mph ${dir} (gusts ${gust})`;
  box.innerHTML=`
    <div class="wx-top"><div class="wx-icon">${ic}</div>
      <div class="wx-now">${big}</div>
      <div class="wx-hl">${isToday?"Today":DAYS[dt.getDay()]} · High ${hi}° · Low ${lo}°</div></div>
    <div class="wx-row"><span>☔ ${rain}% rain</span><span>${windTxt}</span></div>
    <div class="wx-sum">${desc}, high of ${hi}°, ${rainTxt}, ${windWord(wMax)}.</div>`;
}

/* Refresh dates and weather every time the app is opened again */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    const t=startOfToday();
    if(!same(t,today)){today=t;curDate=new Date(today);}
    render();loadWeather();
  }
});

render();loadWeather();
</script>
